<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Coach</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f2933">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1f2933; --muted: #6b7280; --line: #e5e7eb;
    --accent: #326ab6; --accent-soft: #e7f1fb; --done: #2f855a; --warn: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1f25; --ink: #e5e7eb; --muted: #9ca3af; --line: #2d333b;
            --accent: #7aa7e6; --accent-soft: #1d2a3a; --done: #68d391; --warn: #fdba74; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: var(--muted); font-size: 13px; }
  #status.error { color: var(--warn); }
  .hint { font-size: 13px; color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  section { overflow-y: auto; padding: 16px; min-height: 0; }
  section + section { border-left: 1px solid var(--line); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
  h3 { font-size: 14px; margin: 18px 0 6px; color: var(--muted); }
  ol { list-style: none; padding: 0; margin: 0; }
  li.q { display: flex; gap: 10px; padding: 7px 8px; border-radius: 6px; align-items: flex-start; }
  li.q.next { background: var(--accent-soft); outline: 1px solid var(--accent); }
  li.q.answered .text { color: var(--muted); text-decoration: line-through; }
  .num { color: var(--muted); min-width: 22px; text-align: right; }
  input[type=checkbox] { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--done); }
  .tag { font-size: 11px; color: var(--accent); margin-left: 6px; }
  .follow { margin: 4px 0 0 0; padding: 0; list-style: none; }
  .follow li { display: flex; gap: 8px; font-size: 14px; padding: 3px 0; }
  .follow li.answered span { color: var(--muted); text-decoration: line-through; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  form input[type=text] { flex: 1; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
                          background: var(--panel); color: var(--ink); }
  form input[type=number] { width: 70px; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px;
                            background: var(--panel); color: var(--ink); }
  .line { margin: 0 0 10px; }
  .who { font-weight: 600; margin-right: 6px; }
  .who.Them { color: var(--accent); }
  .clock { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .partial { color: var(--muted); font-style: italic; }
  .saved { font-size: 13px; color: var(--done); }
  .empty { color: var(--muted); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    section + section { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Call Coach</h1>
  <button id="choose">Choose questions…</button>
  <button id="start" class="primary" disabled>Start</button>
  <button id="stop" disabled>Stop</button>
  <span class="hint">Use headphones.</span>
  <span id="status"></span>
</header>
<main>
  <section>
    <h2>Questions</h2>
    <div id="questions"><p class="empty">No questions loaded.</p></div>
    <form id="add">
      <input type="text" id="add-text" placeholder="Add a question">
      <input type="number" id="add-num" min="1" placeholder="Under #">
      <button type="submit">Add</button>
    </form>
  </section>
  <section id="transcript-pane">
    <h2>Transcript</h2>
    <div id="transcript"><p class="empty">The transcript appears here once the call starts.</p></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const post = (path, body) => fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify(body || {})});

function renderQuestions(s) {
  if (!s.questions.length) { $("questions").innerHTML = '<p class="empty">No questions loaded.</p>'; return; }
  let html = "", section = null;
  for (const q of s.questions) {
    if (q.section && q.section !== section) {
      if (section !== null || html) html += "</ol>";
      section = q.section; html += `<h3>${esc(section)}</h3><ol>`;
    } else if (!html) html += "<ol>";
    const cls = ["q", q.answered ? "answered" : "", s.next === q.number ? "next" : ""].join(" ");
    const follow = q.followups.map((f, i) =>
      `<li class="${f.answered ? "answered" : ""}"><input type="checkbox" data-n="${q.number}" data-f="${i}" ${f.answered ? "checked" : ""}>` +
      `<span>${esc(f.text)}</span>${f.source === "mcp" ? '<span class="tag">suggested</span>' : ""}</li>`).join("");
    html += `<li class="${cls}"><span class="num">${q.number}</span>` +
      `<input type="checkbox" data-n="${q.number}" ${q.answered ? "checked" : ""}>` +
      `<div><span class="text">${esc(q.text)}</span>${s.next === q.number ? '<span class="tag">ask next</span>' : ""}` +
      (follow ? `<ul class="follow">${follow}</ul>` : "") + "</div></li>";
  }
  html += "</ol>";
  if (s.loose_followups.length) {
    html += "<h3>Follow-ups</h3><ul class='follow'>" + s.loose_followups.map((f) =>
      `<li><span>${esc(f.text)}</span>${f.source === "mcp" ? '<span class="tag">suggested</span>' : ""}</li>`).join("") + "</ul>";
  }
  $("questions").innerHTML = html;
}

function renderTranscript(s) {
  const pane = $("transcript-pane");
  const atBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 40;
  let html = s.transcript.map((l) =>
    `<p class="line"><span class="clock">${l.clock}</span><span class="who ${l.speaker}">${l.speaker}</span>${esc(l.text)}</p>`).join("");
  for (const [who, text] of Object.entries(s.partial || {})) {
    if (text) html += `<p class="line partial"><span class="who ${who}">${who}</span>${esc(text)}</p>`;
  }
  $("transcript").innerHTML = html || '<p class="empty">The transcript appears here once the call starts.</p>';
  if (atBottom) pane.scrollTop = pane.scrollHeight;
}

function render(s) {
  $("title").textContent = s.title || "Call Coach";
  $("start").disabled = s.running || !s.questions.length;
  $("stop").disabled = !s.running;
  $("choose").disabled = s.running;
  const st = $("status");
  st.textContent = s.status + (s.saved.length ? "  " + s.saved.map((p) => p.split("/").pop()).join(", ") : "");
  st.className = /error|failed|missing|not found|No Jev/i.test(s.status) ? "error" : "";
  renderQuestions(s);
  renderTranscript(s);
}

new EventSource("/events").onmessage = (e) => render(JSON.parse(e.data));
$("choose").onclick = () => post("/api/choose");
$("start").onclick = () => post("/api/start");
$("stop").onclick = () => post("/api/stop");
$("questions").addEventListener("change", (e) => {
  const box = e.target;
  if (box.type !== "checkbox") return;
  const body = {number: Number(box.dataset.n)};
  if (box.dataset.f !== undefined) body.followup = Number(box.dataset.f);
  post("/api/toggle", body);
});
$("add").onsubmit = (e) => {
  e.preventDefault();
  const text = $("add-text").value.trim();
  if (!text) return;
  post("/api/add", {text, number: $("add-num").value ? Number($("add-num").value) : null});
  $("add-text").value = ""; $("add-num").value = "";
};
</script>
</body>
</html>
