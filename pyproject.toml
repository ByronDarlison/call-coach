[project]
name = "call-coach"
version = "0.2.0"
description = "Live interview checklist: local transcription, Jev checkmarks, MCP follow-ups."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.10,<2", "httpx>=0.27", "starlette>=0.40", "uvicorn>=0.30"]

[project.scripts]
call-coach = "callcoach.app:main"
call-coach-cli = "callcoach.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["callcoach"]

[tool.setuptools.package-data]
callcoach = ["static/*"]
